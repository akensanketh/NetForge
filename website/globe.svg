<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <!-- Radial Gradients -->
    <radialGradient id="globeGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060919" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for Arc Rings -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="75%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Ambient Glow & Grid -->
  <rect width="1200" height="600" fill="url(#cyberGrid)" />
  <ellipse cx="600" cy="520" rx="550" ry="280" fill="url(#globeGlow)" />
  <ellipse cx="600" cy="560" rx="360" ry="160" fill="url(#coreGlow)" />

  <!-- Outer Orbit Rings -->
  <ellipse cx="600" cy="480" rx="540" ry="170" stroke="url(#ringGrad2)" stroke-width="1.2" stroke-dasharray="6 8" />
  <ellipse cx="600" cy="460" rx="480" ry="150" stroke="url(#ringGrad1)" stroke-width="1.8" />
  <ellipse cx="600" cy="440" rx="420" ry="130" stroke="rgba(0, 210, 255, 0.3)" stroke-width="1" />

  <!-- Wireframe Latitude Curves -->
  <ellipse cx="600" cy="420" rx="360" ry="110" stroke="rgba(96, 165, 250, 0.25)" stroke-width="1" />
  <ellipse cx="600" cy="390" rx="300" ry="90" stroke="rgba(96, 165, 250, 0.2)" stroke-width="1" stroke-dasharray="4 6" />
  <ellipse cx="600" cy="360" rx="230" ry="70" stroke="rgba(96, 165, 250, 0.15)" stroke-width="1" />

  <!-- Wireframe Longitude Arcs -->
  <path d="M 120 480 C 300 240, 900 240, 1080 480" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" fill="none"/>
  <path d="M 220 460 C 380 280, 820 280, 980 460" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.8" fill="none"/>
  <path d="M 320 440 C 450 320, 750 320, 880 440" stroke="rgba(0, 210, 255, 0.6)" stroke-width="2" fill="none"/>
  <path d="M 440 430 C 520 350, 680 350, 760 430" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5" fill="none"/>

  <!-- Continental Topography Contours (Cyber Wireframe Inspired) -->
  <path d="M 380 370 Q 400 355 425 365 T 465 350 T 500 365 T 520 395 T 490 415 T 440 410 T 395 390 Z" 
        stroke="#38bdf8" stroke-width="1.5" fill="rgba(14, 165, 233, 0.08)" stroke-dasharray="2 3"/>
  <path d="M 540 340 Q 580 330 610 345 T 670 340 T 710 365 T 695 395 T 630 405 T 570 380 Z" 
        stroke="#60a5fa" stroke-width="1.6" fill="rgba(59, 130, 246, 0.09)"/>
  <path d="M 730 350 Q 770 335 810 350 T 860 375 T 840 410 T 780 415 T 740 385 Z" 
        stroke="#00d2ff" stroke-width="1.4" fill="rgba(0, 210, 255, 0.07)" stroke-dasharray="3 4"/>
  <path d="M 450 425 Q 480 420 500 445 T 510 475 T 470 480 T 440 455 Z" 
        stroke="#38bdf8" stroke-width="1.2" fill="rgba(14, 165, 233, 0.06)"/>

  <!-- Pulsing Network Nodes & Coordinates -->
  <g id="networkNodes">
    <!-- Node 1 (Zurich/London) -->
    <circle cx="580" cy="350" r="4" fill="#00f0ff" />
    <circle cx="580" cy="350" r="10" stroke="#00f0ff" stroke-width="1" opacity="0.6" />
    
    <!-- Node 2 (New York) -->
    <circle cx="430" cy="370" r="4" fill="#38bdf8" />
    <circle cx="430" cy="370" r="9" stroke="#38bdf8" stroke-width="1" opacity="0.5" />

    <!-- Node 3 (Tokyo) -->
    <circle cx="800" cy="360" r="4" fill="#00d2ff" />
    <circle cx="800" cy="360" r="11" stroke="#00d2ff" stroke-width="1" opacity="0.7" />

    <!-- Node 4 (Singapore) -->
    <circle cx="730" cy="390" r="3.5" fill="#60a5fa" />

    <!-- Node 5 (Sao Paulo) -->
    <circle cx="480" cy="445" r="3.5" fill="#38bdf8" />

    <!-- Cryptographic Interconnect Arcs -->
    <path d="M 430 370 Q 500 320 580 350" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.8"/>
    <path d="M 580 350 Q 690 310 800 360" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.8"/>
    <path d="M 580 350 Q 650 380 730 390" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="3 3" fill="none" opacity="0.6"/>
  </g>

  <!-- Horizon Crest Highlight Line -->
  <path d="M 200 480 C 400 380, 800 380, 1000 480" stroke="url(#ringGrad1)" stroke-width="2.5" fill="none"/>
</svg>

